workflows:
  ios-workflow:
    name: iOS Workflow

    environment:
      flutter: 3.19.1
      xcode: 16.2

    scripts:
      - name: Check Flutter and Dart version
        script: |
          echo "===== FLUTTER VERSION ====="
          which flutter
          flutter --version

          echo "===== DART VERSION ====="
          dart --version

          echo "===== WIN32 ====="
          flutter pub deps | grep -A5 -B5 "win32" || true

          echo "===== SCREENSHOT ====="
          flutter pub deps | grep -A5 -B5 "screenshot" || true

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          rm -rf Pods
          rm -f Podfile.lock
          pod install --repo-update
          cd ..

      - name: Build IPA
        script: |
          flutter build ipa --release --no-codesign

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      email:
        recipients:
          - klartdean@gmail.com