workflows:
  ios-workflow:
    name: iOS Build
    instance_type: mac_mini_m2

    environment:
      flutter: 3.19.0
      xcode: 16.0

    scripts:

      - name: Flutter clean
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          flutter clean

      - name: Flutter pub get
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          flutter pub get

      - name: Install CocoaPods
        script: |
          set -e
          cd "$CM_BUILD_DIR/ios"
          rm -rf Pods Podfile.lock
          pod install --repo-update

      - name: Build iOS IPA
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          # ប្ដូរមកប្រើ flutter build ipa ព្រោះ --no-codesign ត្រូវស៊ីសង្វាក់ជាមួយ ipa command
          flutter build ipa --release --no-codesign

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      email:
        recipients:
          - klartdean@gmail.com