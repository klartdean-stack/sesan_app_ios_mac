workflows:
  ios-workflow:
    name: iOS Build
    instance_type: mac_mini_m2

    environment:
      flutter: 3.19.0
      xcode: 16.0

    scripts:

      - name: Flutter clean
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          flutter clean

      - name: Flutter pub get
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          flutter pub get

      - name: Install CocoaPods
        script: |
          set -e
          cd "$CM_BUILD_DIR/ios"
          pod install --repo-update

      - name: Build iOS
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          flutter build ios --release --no-codesign

    artifacts:
      - build/ios/iphoneos/Runner.app

    publishing:
      email:
        recipients:
          - klartdean@gmail.com