workflows:
  ios-workflow:
    name: iOS Workflow

    environment:
      flutter: 3.19.1
      xcode: 16.2

    scripts:
      - name: Check Flutter and Dart version
        script: |
          echo "===== FLUTTER ====="
          which flutter
          flutter --version

          echo "===== DART ====="
          dart --version

          echo "===== GOOGLE ML KIT ====="
          flutter pub deps | grep -A8 -B5 "google_mlkit"

          echo "===== MOBILE SCANNER ====="
          flutter pub deps | grep -A8 -B5 "mobile_scanner"

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          rm -rf Pods
          rm -f Podfile.lock
          pod install --repo-update
          cd ..

      - name: Build IPA
        script: |
          # ពិនិត្យមើលថា ExportOptions.plist មាន
          if [ ! -f "ios/ExportOptions.plist" ]; then
            echo "⚠️ Warning: ExportOptions.plist not found in ios directory"
            echo "📦 Building with --no-codesign for testing"
            flutter build ipa --release --no-codesign
          else
            echo "✅ ExportOptions.plist found, building with codesign"
            flutter build ipa --release --export-options-plist=ios/ExportOptions.plist
          fi
          
          # បង្ហាញលទ្ធផល
          echo "📁 Build output:"
          ls -la build/ios/ipa/ || echo "No IPA found"

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      email:
        recipients:
          - klartdean@gmail.com