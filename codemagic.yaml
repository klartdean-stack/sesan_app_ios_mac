workflows:
  ios-workflow:
    name: iOS Build
    instance_type: mac_mini_m2

    environment:
      flutter: 3.19.0
      xcode: 16.0

    scripts:

      # ========================================
      # 1. Flutter Clean
      # ========================================
      - name: Flutter clean
        script: |
          set -e
          cd "$CM_BUILD_DIR"

          flutter clean

      # ========================================
      # 2. Flutter Pub Get
      # ========================================
      - name: Flutter pub get
        script: |
          set -e
          cd "$CM_BUILD_DIR"

          flutter pub get

          echo "========================================"
          echo "Checking Generated.xcconfig"
          echo "========================================"

          if [ ! -f "ios/Flutter/Generated.xcconfig" ]; then
            echo "ERROR: ios/Flutter/Generated.xcconfig NOT FOUND"
            exit 1
          fi

          echo "Generated.xcconfig exists"

          grep "FLUTTER_ROOT" \
            ios/Flutter/Generated.xcconfig || true

      # ========================================
      # 3. Install CocoaPods
      # ========================================
      - name: Install CocoaPods
        script: |
          set -e
          cd "$CM_BUILD_DIR/ios"

          echo "========================================"
          echo "Installing CocoaPods"
          echo "========================================"

          pod install --repo-update

          echo "========================================"
          echo "Removing unsupported -G flag from BoringSSL-GRPC"
          echo "========================================"

          find Pods -type f \( -name "*.xcconfig" -o -name "project.pbxproj" \) \
            -print0 | xargs -0 sed -i '' 's/ -G / /g; s/-G / /g'

          echo "Checking remaining -G flags..."

          grep -R -- "-G" Pods/BoringSSL-GRPC 2>/dev/null || true

          echo "========================================"
          echo "CocoaPods completed"
          echo "========================================"
      # ========================================
      # 4. Build iOS
      # ========================================
      - name: Build iOS
        script: |
          set -e
          cd "$CM_BUILD_DIR"

          echo "========================================"
          echo "Building iOS Release"
          echo "========================================"

          flutter build ios \
            --release \
            --no-codesign

          echo "========================================"
          echo "BUILD COMPLETED"
          echo "========================================"

    artifacts:
      - build/ios/iphoneos/Runner.app

    publishing:
      email:
        recipients:
          - klartdean@gmail.com