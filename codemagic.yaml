workflows:
  ios-workflow:
    name: iOS Build
    instance_type: mac_mini_m2

    environment:
      flutter: stable          # ឬ 3.24.0+
      xcode: 16.0
      ios_signing:
        distribution_type: app_store
        bundle_identifier: "com.sesan.app"

    scripts:
      - name: Flutter clean
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          flutter clean

      - name: Flutter pub get
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          flutter pub get

      - name: Install CocoaPods
        script: |
          set -e
          cd "$CM_BUILD_DIR/ios"
          rm -rf Pods Podfile.lock
          pod install --repo-update

      - name: Build iOS IPA
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - klartdean@gmail.com