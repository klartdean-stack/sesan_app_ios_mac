workflows:
  ios-workflow:
    name: iOS Workflow
    environment:
      flutter: 3.19.1
      xcode: 15.4
      groups:
        - appstore_credentials
    scripts:
      - name: Check Flutter and Dart version
        script: |
          echo "===== FLUTTER ====="
          which flutter
          flutter --version
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios
          rm -rf Pods
          rm -f Podfile.lock
          pod install --repo-update
          cd ..
      - name: Build IPA for App Store
        script: |
          flutter clean
          flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - "Internal Testers"
