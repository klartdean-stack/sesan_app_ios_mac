workflows:
  ios-workflow:
    name: iOS Build
    instance_type: mac_mini_m2

    environment:
      flutter: 3.19.0
      xcode: 16.0

    scripts:

      - name: Flutter clean
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          flutter clean

      - name: Flutter pub get
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          flutter pub get

      - name: Install CocoaPods
        script: |
          set -e
          cd "$CM_BUILD_DIR/ios"
          rm -rf Pods Podfile.lock
          pod install --repo-update

      - name: Build iOS App
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          # ใช้ flutter build ios ដើម្បីរំលងការទាមទារ Archive និង Provisioning Profile
          flutter build ios --release --no-codesign

    artifacts:
      # ទាញយក Runner.app ដែលបាន பిల్សរួចរាល់
      - build/ios/iphoneos/Runner.app

    publishing:
      email:
        recipients:
          - klartdean@gmail.com