workflows:
  ios-workflow:
    name: iOS Build
    instance_type: mac_mini_m2

    environment:
      flutter: 3.19.0
      xcode: 16.0

    scripts:
      - name: Flutter clean
        script: |
          flutter clean

      - name: Flutter pub get
        script: |
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios

          pod deintegrate || true

          rm -rf Pods
          rm -f Podfile.lock

          pod install --repo-update

          cd ..

      - name: Locate BoringSSL-GRPC -G flag
        script: |
          echo "========================================"
          echo "LOCATING ALL -G FLAGS"
          echo "========================================"

          echo ""
          echo "===== BoringSSL-GRPC SOURCE ====="

          grep -R -n -C 3 -- "-G" \
            ios/Pods/BoringSSL-GRPC \
            2>/dev/null || true

          echo ""
          echo "===== PODS PROJECT ====="

          grep -n -C 3 -- "-G" \
            ios/Pods/Pods.xcodeproj/project.pbxproj \
            2>/dev/null || true

          echo ""
          echo "===== TARGET SUPPORT FILES ====="

          grep -R -n -C 3 -- "-G" \
            "ios/Pods/Target Support Files/BoringSSL-GRPC" \
            2>/dev/null || true

          echo ""
          echo "===== ALL PODS PROJECT FILES ====="

          grep -R -n -C 2 -- "-G" \
            ios/Pods/Pods.xcodeproj \
            2>/dev/null || true

      - name: Verify SDWebImage patch
        script: |
          echo "Checking SDWebImage..."

          if grep -q "self.isHighDynamicRange" ios/Pods/SDWebImage/SDWebImage/Core/UIImage+Metadata.m; then
            echo "❌ SDWebImage HDR error still exists"
            exit 1
          else
            echo "✅ SDWebImage HDR issue fixed"
          fi

          if grep -q "kCGImageSourceDecodeRequest" ios/Pods/SDWebImage/SDWebImage/Core/SDImageIOAnimatedCoder.m; then
            echo "❌ HDR ImageIO constants still exist"
            exit 1
          else
            echo "✅ HDR ImageIO issue fixed"
          fi

      - name: Build iOS
        script: |
          flutter build ios --release --no-codesign

    artifacts:
      - build/ios/iphoneos/Runner.app

    publishing:
      email:
        recipients:
          - klartdean@gmail.com