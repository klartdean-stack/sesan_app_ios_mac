workflows:
  ios-workflow:
    name: iOS Build
    instance_type: mac_mini_m2

    environment:
      flutter: 3.19.0
      xcode: 16.0

    scripts:

      - name: Flutter clean
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          flutter clean

      - name: Flutter pub get
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          flutter pub get

      - name: Install CocoaPods
        script: |
          set -e
          cd "$CM_BUILD_DIR/ios"

          pod install --repo-update

      - name: Verify BoringSSL-GRPC flags
        script: |
          set -e
          cd "$CM_BUILD_DIR"

          echo "Checking BoringSSL-GRPC..."

          grep -R --line-number -- "-G" \
            ios/Pods/Target\ Support\ Files/BoringSSL-GRPC \
            ios/Pods/Pods.xcodeproj/project.pbxproj \
            2>/dev/null || true

      - name: Build iOS
        script: |
          set -e
          cd "$CM_BUILD_DIR"

          flutter build ios \
            --release \
            --no-codesign

    artifacts:
      - build/ios/iphoneos/Runner.app

    publishing:
      email:
        recipients:
          - klartdean@gmail.com